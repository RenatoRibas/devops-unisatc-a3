name: deploy-terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: false
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    branches:
      - main

env:
  TF_WORKING_DIR: infra
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_environment: ${{ vars.AWS_ENVIRONMENT || 'dev' }}
  TF_VAR_image_name: ${{ secrets.STRAPI_IMAGE_NAME }}
  TF_VAR_app_keys: ${{ secrets.APP_KEYS }}
  TF_VAR_admin_jwt_secret: ${{ secrets.ADMIN_JWT_SECRET }}
  TF_VAR_api_token_salt: ${{ secrets.API_TOKEN_SALT }}
  TF_VAR_transfer_token_salt: ${{ secrets.TRANSFER_TOKEN_SALT }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ secrets.TF_BACKEND_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMO_TABLE }}"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'

      - name: Terraform apply
        if: |
          github.event_name == 'push' && github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false

